[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boom"
version = "0.1.0"
description = "Point-by-point tennis match simulator for pricing player props"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["boom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
